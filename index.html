<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Frame Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Card Frame Pro</h1>
    <p>Create Professional ID Card Frames</p>
</header>

<section class="cards">
    <div class="card">
        <h2>Aadhaar Card</h2>
        <button>Open</button>
    </div>

    <div class="card">
        <h2>PAN Card</h2>
        <button>Open</button>
    </div>

    <div class="card">
        <h2>Voter ID</h2>
        <button>Open</button>
    </div>

    <div class="card">
        <h2>Ration Card</h2>
        <button>Open</button>
    </div>
</section>

<footer>
    © 2026 Card Frame Pro
</footer>

</body>
</html>
<section class="editor">
    <h2>Create Your Card</h2>

    <input type="file" id="photo" accept="image/*">
    <br><br>

    <input type="text" id="name" placeholder="Enter Name">
    <br><br>

    <button id="previewBtn">Preview Card</button>

    <div id="preview">
        <img id="userPhoto" width="120">
        <h3 id="userName"></h3>
    </div>
</section>

<script src="script.js"></script>
